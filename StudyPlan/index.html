<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>StudyPlan | Organizador académico</title><link rel="stylesheet" href="styles.css"><script src="app.js" defer></script></head>
<body><aside><h1>StudyPlan<span>Organizador académico</span></h1><nav><button data-view="inicio" class="active">Inicio</button><button data-view="cursos">Cursos</button><button data-view="tareas">Actividades</button><button data-view="calendario">Calendario</button><button data-view="progreso">Progreso</button></nav><small>Planifica. Organiza. Avanza.</small></aside><main><header><div><p class="eyebrow">MI ESPACIO ACADÉMICO</p><h2 id="titulo">Inicio</h2></div><button id="nueva" class="primary">+ Nueva actividad</button></header>
<section id="inicio"><p>Organiza tus entregas y mantén el control de tus estudios.</p><div id="resumen" class="stats"></div><article><h3>Próximas actividades</h3><div id="proximas"></div></article></section>
<section id="cursos" hidden><article><h3>Mis cursos</h3><form id="cursoForm"><input id="cursoId" type="hidden"><label>Nombre del curso<input id="cursoNombre" required maxlength="80" placeholder="Ej. Base de datos"></label><button class="primary">Guardar curso</button><button type="button" id="cancelCurso">Cancelar edición</button></form><div id="listaCursos"></div></article></section>
<section id="tareas" hidden><article><h3>Mis actividades</h3><div class="filters"><input id="buscar" placeholder="Buscar actividad" aria-label="Buscar actividad"><select id="filtroCurso" aria-label="Filtrar curso"></select><select id="filtroEstado" aria-label="Filtrar estado"><option value="">Todos los estados</option><option>Pendiente</option><option>En proceso</option><option>Completado</option><option>Vencida</option></select></div><div id="listaTareas"></div></article></section>
<section id="calendario" hidden><article><div class="bar"><button id="anterior" aria-label="Mes anterior">←</button><h3 id="mes"></h3><button id="siguiente" aria-label="Mes siguiente">→</button></div><div id="dias" class="calendar"></div></article></section>
<section id="progreso" hidden><article><h3>Avance académico</h3><div id="avance"></div></article></section>
</main><dialog id="modal"><form id="tareaForm"><div class="bar"><h3>Actividad académica</h3><button type="button" id="cerrar" aria-label="Cerrar">×</button></div><input id="tareaId" type="hidden"><label>Título<input id="nombre" required maxlength="100"></label><label>Curso<select id="curso" required></select></label><div class="filters"><label>Tipo<select id="tipo"><option>Tarea</option><option>Examen</option><option>Trabajo</option><option>Exposición</option></select></label><label>Fecha de entrega<input id="fecha" type="date" required></label></div><div class="filters"><label>Prioridad<select id="prioridad"><option>Media</option><option>Alta</option><option>Baja</option></select></label><label>Estado<select id="estado"><option>Pendiente</option><option>En proceso</option><option>Completado</option></select></label></div><label>Descripción<textarea id="descripcion" rows="3"></textarea></label><button class="primary">Guardar actividad</button></form></dialog><div id="aviso" role="status"></div></body></html>
